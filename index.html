<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Due Slip — To-do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --leather: #3d2a22;
      --pocket: #5a3d32;
      --stitch: #c9a27a;
      --manila: #f3e2b8;
      --rule: #d7c08a;
      --ink: #1c1612;
      --mute: #6e5a4a;
      --stamp: #9c1c32;
      --due-blue: #1e4d7b;
      --done: #3d6b4f;
      --shadow: rgba(28, 16, 10, 0.35);
      --focus: #1e4d7b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Instrument Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #6b4638 0%, transparent 50%),
        radial-gradient(900px 500px at 110% 10%, #2a1b16 0%, transparent 45%),
        linear-gradient(160deg, #2b1c18, #4a3128 55%, #231612);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .pocket {
      width: min(560px, 100%);
      background: linear-gradient(180deg, #6a463a, var(--pocket) 18%, var(--leather));
      border-radius: 6px 6px 22px 22px;
      padding: 18px 18px 28px;
      box-shadow:
        0 30px 60px var(--shadow),
        inset 0 1px 0 rgba(255, 230, 200, 0.18);
      position: relative;
    }

    .pocket::before {
      content: "";
      position: absolute;
      inset: 10px 10px auto 10px;
      height: 10px;
      border-top: 2px dashed var(--stitch);
      opacity: 0.55;
      pointer-events: none;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: #f6e7cf;
      padding: 8px 8px 14px;
      letter-spacing: 0.08em;
    }

    .brand h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 400;
      margin: 0;
      letter-spacing: 0;
    }

    .brand .branch {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .card {
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0 31px,
          var(--rule) 31px 32px
        ),
        linear-gradient(90deg, #f7e9c4, var(--manila));
      border-radius: 2px;
      min-height: 420px;
      padding: 22px 22px 18px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.18), 0 18px 28px rgba(0, 0, 0, 0.22);
      position: relative;
    }

    .card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 18px;
      width: 18px;
      height: 26px;
      background: linear-gradient(#5a3d32, #3d2a22);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 70%, 0 100%);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .meta dt {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--mute);
      margin: 0;
    }

    .meta dd {
      margin: 2px 0 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.15rem;
    }

    .stamp {
      justify-self: end;
      align-self: start;
      border: 3px solid var(--stamp);
      color: var(--stamp);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 6px 8px 4px;
      transform: rotate(8deg);
      opacity: 0.9;
    }

    form {
      display: flex;
      gap: 8px;
      margin: 8px 0 18px;
    }

    #task-input {
      flex: 1;
      border: none;
      background: transparent;
      border-bottom: 2px solid var(--due-blue);
      font: 500 1rem/1.4 "Instrument Sans", system-ui, sans-serif;
      color: var(--ink);
      padding: 8px 2px;
      outline: none;
    }

    #task-input:focus {
      border-bottom-color: var(--stamp);
    }

    #task-input::placeholder {
      color: #9a8364;
      font-style: italic;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .add {
      background: var(--due-blue);
      color: #f4efe6;
      border: none;
      border-radius: 2px;
      padding: 8px 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .add:hover { filter: brightness(1.08); }

    .add:focus-visible,
    .check:focus-visible,
    .delete:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      animation: settle 220ms ease-out;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    .check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--ink);
      background: transparent;
      border-radius: 2px;
      display: grid;
      place-items: center;
      padding: 0;
      color: transparent;
    }

    .item.done .check {
      background: var(--done);
      border-color: var(--done);
      color: #f4efe6;
    }

    .text {
      font-size: 1.02rem;
      word-break: break-word;
    }

    .item.done .text {
      color: var(--mute);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete {
      border: none;
      background: none;
      color: var(--stamp);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 2px;
      opacity: 0.75;
    }

    .delete:hover { opacity: 1; }

    .empty {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      color: var(--mute);
      margin: 28px 4px 8px;
    }

    .empty[hidden],
    .list:empty + .empty { display: block; }

    .list:not(:empty) + .empty { display: none; }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      color: var(--mute);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .item { animation: none; }
    }
  </style>
</head>
<body>
  <main class="pocket">
    <header class="brand">
      <h1>Due Slip</h1>
      <span class="branch">Open stacks · local copy</span>
    </header>

    <section class="card" aria-labelledby="app-title">
      <dl class="meta">
        <div>
          <dt id="app-title">Borrower</dt>
          <dd>Today’s list</dd>
        </div>
        <div class="stamp" id="count-stamp">0 open</div>
      </dl>

      <form id="task-form" autocomplete="off">
        <label class="visually-hidden" for="task-input" style="position:absolute;left:-9999px">New task</label>
        <input id="task-input" name="task" type="text" maxlength="160" placeholder="Write a task, then file it" required />
        <button class="add" type="submit">File</button>
      </form>

      <ul class="list" id="task-list"></ul>
      <p class="empty" id="empty-state">The pocket is empty. File the first thing you owe yourself.</p>

      <div class="foot">
        <span>Kept in this browser</span>
        <span id="date-line"></span>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "due-slip-tasks";

    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const stamp = document.getElementById("count-stamp");
    const dateLine = document.getElementById("date-line");

    dateLine.textContent = new Date().toLocaleDateString(undefined, {
      weekday: "short",
      month: "short",
      day: "numeric"
    });

    let tasks = loadTasks();
    render();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({
        id: crypto.randomUUID(),
        text,
        done: false
      });
      input.value = "";
      persist();
      render();
      input.focus();
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const item = button.closest(".item");
      if (!item) return;
      const id = item.dataset.id;

      if (button.dataset.action === "toggle") {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, done: !task.done } : task
        );
      }

      if (button.dataset.action === "delete") {
        tasks = tasks.filter((task) => task.id !== id);
      }

      persist();
      render();
    });

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function render() {
      const open = tasks.filter((task) => !task.done).length;
      stamp.textContent = open === 1 ? "1 open" : `${open} open`;

      list.replaceChildren(
        ...tasks.map((task) => {
          const li = document.createElement("li");
          li.className = "item" + (task.done ? " done" : "");
          li.dataset.id = task.id;

          const toggle = document.createElement("button");
          toggle.className = "check";
          toggle.type = "button";
          toggle.dataset.action = "toggle";
          toggle.setAttribute("aria-pressed", String(task.done));
          toggle.setAttribute("aria-label", task.done ? `Mark “${task.text}” as not done` : `Complete “${task.text}”`);
          toggle.textContent = "✓";

          const text = document.createElement("span");
          text.className = "text";
          text.textContent = task.text;

          const del = document.createElement("button");
          del.className = "delete";
          del.type = "button";
          del.dataset.action = "delete";
          del.setAttribute("aria-label", `Delete “${task.text}”`);
          del.textContent = "Void";

          li.append(toggle, text, del);
          return li;
        })
      );
    }
  </script>
</body>
</html>
